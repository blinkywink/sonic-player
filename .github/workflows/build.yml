name: Build Sonic

# Every push builds and tests Windows, Linux, macOS and the iPhone app. Pushing a
# tag such as v0.3.0 also publishes a GitHub Release with every download attached;
# installed Windows copies update themselves from the latest release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust stable
        run: rustup update stable --no-self-update
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path native/Cargo.toml
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path native/target/release/sonicplayer.exe -DestinationPath dist/sonicplayer-windows-x64.zip
          # The bare exe is what installed copies download to update themselves.
          Copy-Item native/target/release/sonicplayer.exe dist/sonicplayer-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sonicplayer-windows-x64
          path: |
            dist/sonicplayer-windows-x64.zip
            dist/sonicplayer-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        # ALSA for audio, xkbcommon/X11/Wayland for windows, fontconfig for fonts,
        # GL/EGL/GBM for the GPU renderer.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libfontconfig1-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev             libgl-dev libegl-dev libgbm-dev
      - name: Update Rust stable
        run: rustup update stable --no-self-update
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path native/Cargo.toml
      - name: Package
        run: |
          mkdir -p dist/sonic
          cp native/target/release/sonicplayer dist/sonic/
          cp native/packaging/linux/sonic.desktop native/packaging/linux/install.sh dist/sonic/
          cp native/assets/icon.png dist/sonic/sonic.png
          chmod +x dist/sonic/install.sh dist/sonic/sonicplayer
          tar -C dist -czf dist/sonicplayer-linux-x64.tar.gz sonic
      - uses: actions/upload-artifact@v4
        with:
          name: sonicplayer-linux-x64
          path: dist/sonicplayer-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust stable
        run: rustup update stable --no-self-update
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path native/Cargo.toml
      - name: Package Sonic.app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)
          app=dist/Sonic.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources" icon.iconset
          cp native/target/release/sonicplayer "$app/MacOS/"
          sed "s/0\.1\.0/$version/" native/packaging/macos/Info.plist > "$app/Info.plist"
          for size in 16 32 128 256 512; do
            sips -z $size $size native/assets/logo.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) native/assets/logo.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Resources/icon.icns"
          # Not notarized: ad-hoc sign so Apple Silicon will run it.
          codesign --force --deep --sign - dist/Sonic.app
          ditto -c -k --keepParent dist/Sonic.app dist/sonicplayer-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sonicplayer-macos-arm64
          path: dist/sonicplayer-macos-arm64.zip
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust stable and add the iOS target
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-apple-ios
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-ios --manifest-path mobile/Cargo.toml
      - name: Package unsigned Sonic.ipa
        # Unsigned: sideloading tools (AltStore, Sideloadly, etc.) sign it with your Apple ID.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' mobile/Cargo.toml | head -1)
          app=dist/Payload/Sonic.app
          mkdir -p "$app"
          cp mobile/target/aarch64-apple-ios/release/sonic-mobile "$app/"
          sed "s/0\.2\.0/$version/" mobile/packaging/Info.plist > "$app/Info.plist"
          cp mobile/assets/AppIcon60x60@2x.png mobile/assets/AppIcon60x60@3x.png "$app/"
          printf 'APPL????' > "$app/PkgInfo"
          # Record the SDK it was built with, like Xcode does.
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          plutil -insert DTSDKName -string "iphoneos$sdk" "$app/Info.plist"
          plutil -insert DTPlatformVersion -string "$sdk" "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          # Ad-hoc signature: sideloading tools replace it with yours, but some
          # (zsign-based ones) need a signature to already be there.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --verbose "$app"
          (cd dist && zip -qry sonic-ios-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-ios-unsigned
          path: dist/sonic-ios-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match native/Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sonic ${GITHUB_REF_NAME#v}" \
            --generate-notes
