name: Build Sonic

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust stable
        run: rustup update stable --no-self-update
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path native/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sonicplayer-windows-x64
          path: native/target/release/sonicplayer.exe
          if-no-files-found: error
