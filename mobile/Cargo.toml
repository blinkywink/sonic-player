[package]
name = "sonic-mobile"
version = "0.5.13"
edition = "2024"
description = "Sonic for iPhone: a lean Plex music player"
repository = "https://github.com/blinkywink/sonic-player"

# Shares Sonic's Plex, streaming and local-file code with the desktop app
# (see the #[path] modules in src/main.rs). On desktop it runs in a phone-sized
# window for testing.

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-software", "compat-1-2", "image-default-formats"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fastrand = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rodio = { version = "0.21", features = ["symphonia-all"] }
lofty = "0.25"
md5 = "0.7"

[build-dependencies]
slint-build = "1.19"

# Opens Plex sign-in on desktop test builds; iOS uses UIKit (src/ios.rs).
[target.'cfg(not(target_os = "ios"))'.dependencies]
open = "5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

# A smaller app: no symbol table, and the compiler optimizes across the whole
# program. Smaller downloads, faster launch, and on-device signers handle it.
[profile.release]
strip = true
lto = "thin"
