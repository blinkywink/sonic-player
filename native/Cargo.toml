[package]
name = "sonicplayer"
version = "0.5.18"
edition = "2024"
description = "Sonic: a native Plex and local music player"
repository = "https://github.com/blinkywink/sonic-player"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "image-default-formats", "raw-window-handle-06"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
lofty = "0.25"
discord-rich-presence = "1.1"
rodio = { version = "0.21", features = ["symphonia-all"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
tempfile = "3"
fastrand = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

rfd = "0.18"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.19"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
